<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SpongeBob FlashPants</title>

  <style>
    @font-face {
      font-family: TikiPL;
      src: url('../../../fonts/TikiPL.woff2');
    }

    @font-face {
      font-family: "Tiki Island";
      src: url('../../../fonts/Tiki-Island.woff2');
    }

    body {
      margin: 0;
      padding: 0;
      background-image: url('../../../background.jpg');
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      font-family: TikiPL;
      color: #000;
    }

    .top-message {
      background: #003399;
      color: white;
      padding: 8px;
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      font-size: 18px;
      border-bottom: 2px solid #000066;
      text-align: center;
    }

    .back-button {
      color: white;
      text-decoration: none;
      margin-right: 20px;
    }

    a {
      color: inherit;
      text-decoration: inherit;
    }

      a:hover {
      color: #8099cc;
    }

    .source {
      background: #003399;
      color: white;
      padding: 8px;
      font-size: 18px;
      text-decoration: none;
      border-top: 2px solid #000066;
      text-align: center;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      font-family: "Tiki Island"
    }
    
  </style>
</head>

<script type="application/javascript" src="flambe.js"></script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script type="application/javascript" src="../../../swfobject.js"></script>
<script type="application/javascript">
  const DEFAULT_WIDTH = 960;
  const DEFAULT_HEIGHT = 560;

  let gameEl;

  function getAvailableSize() {
    const topBar = document.querySelector(".top-message");
    const bottomBar = document.querySelector(".source");

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const topH = topBar ? topBar.offsetHeight : 0;
    const bottomH = bottomBar ? bottomBar.offsetHeight : 0;

    return {
      width: vw,
      height: vh - topH - bottomH,
      topH,
      bottomH
    };
  }

  function calculateScale() {
    const available = getAvailableSize();
    return Math.min(
      available.width / DEFAULT_WIDTH,
      available.height / DEFAULT_HEIGHT
    );
  }

  function applyZoomSize() {
    if (!gameEl) return;

    const available = getAvailableSize();
    const scale = calculateScale();

    const scaledWidth = DEFAULT_WIDTH * scale;
    const scaledHeight = DEFAULT_HEIGHT * scale;

    const left = Math.max(0, (available.width - scaledWidth) / 2);
    const top = Math.max(
      available.topH,
      available.topH + (available.height - scaledHeight) / 2
    );

    gameEl.style.position = "absolute";
    gameEl.style.left = Math.floor(left) + "px";
    gameEl.style.top = Math.floor(top) + "px";

    gameEl.style.width = DEFAULT_WIDTH + "px";
    gameEl.style.height = DEFAULT_HEIGHT + "px";

    gameEl.style.transformOrigin = "top left";
    gameEl.style.transform = `scale(${scale})`;
  }

  function embedOnce() {
    gameEl = document.getElementById("game");

    swfobject.embedSWF(
      "main-flash.swf",
      "game",
      DEFAULT_WIDTH,
      DEFAULT_HEIGHT,
      "10",
      null,
      null,
      { wmode: "direct" }
    );

    setTimeout(() => {
      gameEl = document.getElementById("game");
      applyZoomSize();
    }, 50);
  }

  window.addEventListener("resize", applyZoomSize);

  document.onreadystatechange = function () {
    if (document.readyState === "complete") {
      embedOnce();
    }
  };
</script>

<body>

  <div class="top-message">
    <a href="../../../pl" class="back-button">Back</a>

    <div style="margin: 0 auto;">
      Powrót na potworną wyspę - Return to Monster Island
    </div>
  </div>

  <div id="game"></div>

  <div class="source">
    Source: <a target="_blank" href="https://www8.agame.com/mirror/flash/r/Return_to_monsterland/?flambe=flash">www8.agame.com/mirror/flash/r/Return_to_monsterland/?flambe=flash</a>
  </div>

</body>
</html>
