<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SpongeBob FlashPants</title>

  <style>
    @font-face {
      font-family: TikiPL;
      src: url('../../../fonts/TikiPL.woff2');
    }

    @font-face {
      font-family: "Tiki Island";
      src: url('../../../fonts/Tiki-Island.woff2');
    }

    body {
      margin: 0;
      padding: 0;
      background-image: url('../../../background.jpg');
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: cover;
      font-family: TikiPL;
      color: #000;
    }

    .top-message {
      background: #003399;
      color: white;
      padding: 8px;
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      font-size: 18px;
      border-bottom: 2px solid #000066;
      text-align: center;
    }

    .back-button {
      color: white;
      text-decoration: none;
      margin-right: 20px;
    }

    a {
      color: inherit;
      text-decoration: inherit;
    }

      a:hover {
      color: #8099cc;
    }

    .source {
      background: #003399;
      color: white;
      padding: 8px;
      font-size: 18px;
      text-decoration: none;
      border-top: 2px solid #000066;
      text-align: center;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      font-family: "Tiki Island"
    }
    
  </style>
</head>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script type="application/javascript" src="../../../swfobject.js"></script>
<script type="application/javascript">
  const DEFAULT_WIDTH = 600;
  const DEFAULT_HEIGHT = 400;
  const ASPECT_RATIO = DEFAULT_WIDTH / DEFAULT_HEIGHT;

  let shellEl;
  let gameEl;

  function getAvailableSize() {
    const topBar = document.querySelector(".top-message");
    const bottomBar = document.querySelector(".source");

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const topH = topBar ? topBar.offsetHeight : 0;
    const bottomH = bottomBar ? bottomBar.offsetHeight : 0;

    return {
      width: vw,
      height: vh - topH - bottomH,
      topH,
      bottomH
    };
  }

  function calculateScale() {
    const available = getAvailableSize();
    return Math.min(
      available.width / DEFAULT_WIDTH,
      available.height / DEFAULT_HEIGHT
    );
  }

  function applyZoomSize() {
    if (!shellEl) return;

    const available = getAvailableSize();
    const scale = calculateScale();

    const scaledWidth = DEFAULT_WIDTH * scale;
    const scaledHeight = DEFAULT_HEIGHT * scale;

    const left = Math.max(0, (available.width - scaledWidth) / 2);
    const top = Math.max(
      available.topH,
      available.topH + (available.height - scaledHeight) / 2
    );

    shellEl.style.position = "absolute";
    shellEl.style.left = Math.floor(left) + "px";
    shellEl.style.top = Math.floor(top) + "px";

    shellEl.style.width = DEFAULT_WIDTH + "px";
    shellEl.style.height = DEFAULT_HEIGHT + "px";
    shellEl.style.overflow = "hidden";

    shellEl.style.transform = "none";
    shellEl.style.transformOrigin = "";
    shellEl.style.zoom = scale;
  }

  function embedOnce() {
    shellEl = document.getElementById("game-shell");
    gameEl = document.getElementById("game");

    swfobject.embedSWF(
      "main.swf",
      "game",
      DEFAULT_WIDTH,
      DEFAULT_HEIGHT,
      "10",
      null,
      null,
      { wmode: "direct" }
    );

    setTimeout(() => {
      shellEl = document.getElementById("game-shell");
      gameEl = document.getElementById("game");
      applyZoomSize();
    }, 50);
  }

  window.addEventListener("resize", applyZoomSize);

  document.onreadystatechange = function () {
    if (document.readyState === "complete") {
      embedOnce();
    }
  };
</script>

<body>

  <div class="top-message">
    <a href="../../../pl" class="back-button">Back</a>

    <div style="margin: 0 auto;">
      Bitwa na kulki - Spitwad Showdown
    </div>
  </div>

  <div id="game-shell">
  <div id="game"></div>
</div>

  <div class="source">
    Source: <a target="_blank" href="https://web.archive.org/web/20121124040904/http://www.nick.com.pl/swf/games/sb_spit/main.swf">nick.com.pl/swf/games/sb_spit/main.swf</a><br>Translation .XML is missing, game is mostly in English. A few lines have been modified by me based on <a target="_blank" href="https://web.archive.org/web/20111013135745/http://nick.com.pl/nick-games/g-48/_grythumb/bitwa_na_kulki.jpg">this image</a>. .SWF and config were modified so that the game would look for its files in the correct places.
  </div>

</body>
</html>
